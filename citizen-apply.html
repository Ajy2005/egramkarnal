<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Apply Portal - ASSK / KHK</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f7fa; margin: 0; padding: 0; }
        .navbar { background: #d35400; color: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h2 { margin: 0; font-size: 20px; }
        .btn-logout { background: #fff; color: #d35400; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .apply-card { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .apply-card h3 { color: #2c3e50; margin-bottom: 20px; border-bottom: 2px solid #e67e22; display: inline-block; padding-bottom: 5px;}
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; color: #34495e; margin-bottom: 8px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
        
        .btn-submit { background: #27ae60; color: #fff; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        .btn-submit:hover { background: #1e8449; }
        
        .status-box { margin-top: 30px; background: #e8f8f5; padding: 20px; border-radius: 8px; border-left: 5px solid #1abc9c; }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>🏛️ Citizen Service Portal (नागरिक सेवा केंद्र)</h2>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div class="container">
        <div class="apply-card">
            <h3>📝 Apply for New Service (नवीन अर्ज करा)</h3>
            
            <form id="citizenApplyForm">
                <div class="form-group">
                    <label>Applicant Full Name (अर्जदाराचे पूर्ण नाव) *</label>
                    <input type="text" id="appName" required placeholder="Enter full name">
                </div>

                <div class="form-group">
                    <label>Select Service (दाखला प्रकार) *</label>
                    <select id="appService" required>
                        <option value="">-- Select Service --</option>
                        <option value="जन्म नोंद दाखला (Birth Certificate)">जन्म नोंद दाखला (Birth Certificate)</option>
                        <option value="मृत्यू नोंद दाखला (Death Certificate)">मृत्यू नोंद दाखला (Death Certificate)</option>
                        <option value="रहिवासी दाखला (Residence Certificate)">रहिवासी दाखला (Residence Certificate)</option>
                        <option value="KHK School Admission 2026">School Admission 2026 (KHK)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Bank UTR / Transaction ID (पेमेंट पुरावा क्र.) *</label>
                    <input type="text" id="appUtr" required placeholder="e.g. 123456789012">
                </div>

                <button type="submit" class="btn-submit">Submit Application (अर्ज सादर करा)</button>
            </form>
        </div>

        <!-- Showing Citizen their previously submitted items -->
        <div class="status-box">
            <h4>Your Recent Applications</h4>
            <ul id="myApplications" style="margin-top:10px; color:#555;">
                <!-- Filled via JS -->
            </ul>
        </div>
    </div>

    <script>
        // Load applications specific to this session
        function loadMyApplications() {
            let db = JSON.parse(localStorage.getItem('gp_applications')) || [];
            let list = document.getElementById('myApplications');
            list.innerHTML = "";
            
            // Getting the last 3 applications just as an example
            let myApps = db.slice(-3).reverse();
            if(myApps.length === 0) { list.innerHTML = "<li>No recent applications found.</li>"; }

            myApps.forEach(app => {
                let statusIcon = app.status === 'Pending' ? '⏳ Pending' : '✅ Verified';
                list.innerHTML += `<li><b>${app.service}</b> - UTR: ${app.utr} [Status: ${statusIcon}]</li>`;
            });
        }

        // Form Submit Handler
        document.getElementById('citizenApplyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 1. Get Data
            let name = document.getElementById('appName').value;
            let service = document.getElementById('appService').value;
            let utr = document.getElementById('appUtr').value;
            
            // 2. Generate Application Number
            let appNo = "GP-2026-" + Math.floor(10000 + Math.random() * 90000);

            // 3. Create Record Object (Formatted exactly for your ASSK Dashboard.html)
            let newRecord = {
                appNo: appNo,
                name: name,
                service: service,
                utr: utr,
                screenshot: "#", 
                status: "Pending", // Staff will verify this on Dashboard
                date: new Date().toLocaleDateString()
            };

            // 4. Save to LocalStorage Database
            let db = JSON.parse(localStorage.getItem('gp_applications')) || [];
            db.push(newRecord);
            localStorage.setItem('gp_applications', JSON.stringify(db));

            alert(`✅ Application Submitted Successfully!\nYour Application ID is: ${appNo}\nPlease wait for staff verification.`);
            
            document.getElementById('citizenApplyForm').reset();
            loadMyApplications();
        });

        function logout() {
            // If using Firebase: firebase.auth().signOut().then(...)
            window.location.href = "login.html";
        }

        window.onload = loadMyApplications;
    </script>
</body>
</html>
